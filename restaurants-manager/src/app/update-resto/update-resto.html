<div class="container">
  <div>
    <h2>Restaurant :</h2>
  </div>
  <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID</label>
      <input
        Restaurant
        type="number"
        [(ngModel)]="currentResto.id"
        name="id"
        class="form-control"
      />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Name</label>
      <input
        Restaurant
        type="text"
        [(ngModel)]="currentResto.name"
        name="name"
        class="form-control"
      />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Address</label>
      <input
        Restaurant
        type="text"
        [(ngModel)]="currentResto.address"
        name="address"
        class="form-control"
      />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Cuisine</label>
      <select
        class="form-control form-control-lg"
        id="idCuisine"
        name="idCuisine"
        [(ngModel)]="updatedCuisineId"
      >
        @for (cuisine of cuisineTypes; track cuisine.idCuisine) {
          <option [value]="cuisine.idCuisine">{{ cuisine.nomCuisine }}</option>
        }
      </select>
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Open Date</label>
      <input
        Restaurant
        type="date"
        [(ngModel)]="currentResto.dateOpened"
        name="dateOpened"
        class="form-control"
      />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Capacity</label>
      <input
        Restaurant
        type="number"
        [(ngModel)]="currentResto.capacity"
        name="capacity"
        class="form-control"
      />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Phone Number</label>
      <input
        Restaurant
        type="text"
        [(ngModel)]="currentResto.phoneNumber"
        name="phoneNumber"
        class="form-control"
      />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Rating</label>
      <input
        Restaurant
        type="number"
        [(ngModel)]="currentResto.rating"
        name="rating"
        class="form-control"
      />
    </div>

    <div class="mt-2">
      <button type="submit" (click)="updateResto()" class="btn btn-success">Modifiy</button>
    </div>
  </form>
</div>
