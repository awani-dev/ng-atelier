<div class="container">
  <div>
    <h2>Add A Restaurant :</h2>
  </div>
  <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID</label>
      <input Restaurant type="number" [(ngModel)]="newResto.id" name="id" class="form-control" />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Name</label>
      <input Restaurant type="text" [(ngModel)]="newResto.name" name="name" class="form-control" />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Address</label>
      <input
        Restaurant
        type="text"
        [(ngModel)]="newResto.address"
        name="address"
        class="form-control"
      />
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Cuisine Type</label>
      <select
        class="form-control form-control-lg"
        id="idCuisine"
        name="idCuisine"
        [(ngModel)]="newIdCuisine"
      >
        @for (cuisine of cuisineTypes; track cuisine.idCuisine) {
          <option [value]="cuisine.idCuisine">{{ cuisine.nomCuisine }}</option>
        }
      </select>
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Open Date</label>
      <input
        Restaurant
        type="date"
        [(ngModel)]="newResto.dateOpened"
        name="dateOpened"
        class="form-control"
      />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Capacity</label>
      <input
        Restaurant
        type="number"
        [(ngModel)]="newResto.capacity"
        name="capacity"
        class="form-control"
      />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Phone Number</label>
      <input
        Restaurant
        type="text"
        [(ngModel)]="newResto.phoneNumber"
        name="phoneNumber"
        class="form-control"
      />
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Rating</label>
      <input
        Restaurant
        type="number"
        [(ngModel)]="newResto.rating"
        name="rating"
        class="form-control"
      />
    </div>

    <div class="mt-2">
      <button type="submit" (click)="addResto()" class="btn btn-success">Add</button>
    </div>
  </form>
</div>
